<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>휴브릿지 비즈니스 플랫폼</title>
  <meta name="description" content="렌탈, 미용재료, 상품중개, 사업자금 상담을 연결하는 비즈니스 플랫폼입니다.">

  <meta property="og:title" content="휴브릿지 비즈니스 플랫폼">
  <meta property="og:description" content="렌탈, 미용재료, 상품중개, 사업자금 상담 플랫폼">
  <meta property="og:url" content="https://imdaeho242-bot.github.io/homepage/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="휴브릿지 비즈니스 플랫폼">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, 'Noto Sans KR', sans-serif;
      background: #111827;
      color: #ffffff;
    }

    .container {
      width: 100%;
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 30px;
      text-align: center;
      color: #ffffff;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: #f4d7d7;
      color: #111827;
      border-radius: 18px;
      padding: 22px 14px;
      text-align: center;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .card.wide {
      grid-column: span 2;
      background: #e9b88f;
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 19px;
      font-weight: 800;
    }

    .card p {
      margin: 0 0 14px;
      font-size: 14px;
      line-height: 1.5;
      color: #333;
    }

    .btn {
      display: inline-block;
      padding: 9px 16px;
      background: #111827;
      color: #ffffff;
      border-radius: 30px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      margin-top: 6px;
    }

    .phone {
      margin-top: 28px;
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      text-align: center;
    }

    @media (max-width: 420px) {
      .container {
        padding: 30px 16px;
      }

      .title {
        font-size: 24px;
      }

      .card {
        padding: 20px 12px;
        min-height: 140px;
      }

      .card h2 {
        font-size: 17px;
      }

      .card p {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="title">휴브릿지 비즈니스 플랫폼</div>

    <div class="grid">
      <div class="card">
        <h2>기업가형 병원</h2>
        <p>병원 운영 자금<br>렌탈 상담 안내</p>
        <a class="btn" href="tel:010-6451-9115">전화 상담 바로가기</a>
      </div>

      <div class="card">
        <h2>제조소형 창업</h2>
        <p>창업 자금<br>상품 중개 상담</p>
        <a class="btn" href="tel:010-6451-9115">비즈니스 상담</a>
      </div>

      <div class="card wide">
        <h2>미용재료</h2>
        <p>미용재료 및<br>클리닉 제품 상담</p>
        <a class="btn" href="tel:010-6451-9115">미용재료 바로가기</a>
      </div>
    </div>

    <div class="phone">
      상담 문의 010-6451-9115
    </div>
  </div>
</body>
</html>
