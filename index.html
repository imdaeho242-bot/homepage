<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>휴브릿지 비즈 24</title>
    <style>
        /* 기본 스타일 초기화 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', dotum, sans-serif;
        }

        body {
            /* 보내주신 배경 사진을 배경으로 지정 */
            background-image: url('background_river.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 메인 그린 컨테이너 */
        .main-container {
            background-color: #1a4d32; /* 진한 녹색 배경 */
            width: 100%;
            max-width: 450px;
            border-radius: 30px;
            padding: 30px 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }

        /* 타이틀 섹션 */
        .main-title {
            color: #f3e5ab; /* 연한 골드빛 글자색 */
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .sub-title {
            color: #a3c2b2;
            font-size: 13px;
            margin-bottom: 20px;
            word-spacing: 5px;
        }

        /* 환영 문구 (30% 축소 + 줄바꿈 + 예쁘게 정렬) */
        .welcome-text {
            color: #ffffff;
            font-size: 10.5px;
            line-height: 1.5;
            margin-bottom: 25px;
            font-weight: normal;
            letter-spacing: 0.5px;
            opacity: 0.85;
        }

        /* 2열 배치 카드 섹션 (렌탈 / 상품판매·중개) */
        .grid-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .card {
            background-color: #ffffff;
            border-radius: 20px;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 205px;
        }

        .card-title {
            color: #111111;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .card-desc {
            color: #777777;
            font-size: 11px;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        /* 버튼 공통 스타일 */
        .btn {
            display: block;
            text-decoration: none;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            border-radius: 50px;
            padding: 10px 5px;
            margin-bottom: 8px;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:last-child {
            margin-bottom: 0;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* 녹색 버튼 (렌탈 전용) */
        .btn-green {
            background-color: #1a4d32;
            color: #ffffff;
        }

        .btn-green:hover {
            background-color: #123623;
        }

        /* 브라운 버튼 (중개 / 미용재료 전용) */
        .btn-brown {
            background-color: #b88e57;
            color: #ffffff;
        }

        .btn-brown:hover {
            background-color: #967143;
        }

        /* 하단 투명 테두리 버튼 (패밀리 사이트 전용) */
        .btn-outline {
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 13px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .btn-outline:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* 하단 가로로 긴 미용재료 카드 */
        .full-card {
            background-color: #fff9ed;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
        }

        /* 하단 푸터 섹션 타이틀 */
        .footer-title {
            color: #a3c2b2;
            font-size: 12px;
            font-weight: bold;
            text-align: left;
            margin-left: 5px;
            margin-bottom: 10px;
            border-left: 3px solid #b88e57;
            padding-left: 6px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1 class="main-title">휴브릿지 비즈 24</h1>
        <div class="sub-title">미용재료 · 기업/가정 렌탈 · 상품중개</div>

        <p class="welcome-text">
            저희 공식 홈페이지에<br>오신 것을 환영합니다.
        </p>

        <div class="grid-section">
            <div class="card">
                <div>
                    <h2 class="card-title">기업·가정 렌탈</h2>
                    <p class="card-desc">운영 및 생활 가전 지원</p>
                </div>
                <div>
                    <a href="https://blog.naver.com/sora2220" target="_blank" class="btn btn-green">장비렌탈 바로가기</a>
                    <a href="http://withmoa.co.kr" target="_blank" class="btn btn-green" style="margin-top: 5px;">가전 렌탈 바로가기</a>
                </div>
            </div>

            <div class="card">
                <div>
                    <h2 class="card-title">판매·중개</h2>
                    <p class="card-desc">음식물처리기<br>자료 보기</p>
                </div>
             <a href="http://www.제로스톤.com" target="_blank" class="btn" style="background-color: #1e4d38; color: #ffffff;">상품중개 바로가기</a> 
        </div>
</div>

<!-- 미용재료 영역: 원래 있던 홈페이지 고유 클래스(full-card)로 완벽하게 복원 -->
<div class="full-card">
    <h2 class="card-title" style="font-size: 17px; margin-bottom: 3px;">미용재료</h2>
    <p class="card-desc" style="margin-bottom: 15px;">미용재료 및 클리닉 제품 공급</p>
    <a href="https://blog.naver.com/dlaeogh3" target="_blank" class="btn btn-brown" style="font-size: 13px; padding: 12px;">미용재료 바로가기</a>
</div>

<!-- 패밀리 사이트 영역: 원래 디자인 틀 그대로 우측 이미지 배치로 복원 -->
<div style="margin-top: 15px;">
    <div class="footer-title">패밀리 사이트</div>
    <a href="https://blog.naver.com/haeyoung924" target="_blank" class="btn btn-outline">햇빛 노인재가센터 바로가기</a>
    <a href="https://blog.naver.com/tmdgusdk119" target="_blank" class="btn btn-outline" style="margin-bottom: 0;">(주)천리환경 바로가기</a>
</div>

</div>
</body>
</html>
