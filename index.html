<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>휴브릿지 비즈 24</title>
  <style>
    :root { 
      --main-bg: #0f2027; /* 더 어두운 네이비톤 배경으로 변경 */
      --accent-gold: #c5a059; 
      --card-bg: #ffffff; 
      --text-main: #ffffff; 
      --text-dark: #333333; 
    }
    body { background-color: var(--main-bg); margin: 0; padding: 20px; font-family: 'Pretendard', sans-serif; color: var(--text-main); }
    
    /* PC에서 화면을 꽉 채우도록 설정 (max-width를 1000px로 확대) */
    .main-wrapper { width: 95%; max-width: 1000px; margin: 0 auto; }
    
    .brand-header { text-align: center; margin-bottom: 40px; }
    .title-img { width: 100%; max-width: 800px; height: auto; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    
    /* 버튼 밸런스: PC에서는 50:50, 모바일에서는 100% */
    .button-group { display: flex; flex-direction: column; gap: 15px; margin-top: 30px; max-width: 700px; margin-left: auto; margin-right: auto; }
    @media (min-width: 600px) { .button-group { flex-direction: row; } }
    
    .phone-link, .kakao-btn { flex: 1; padding: 20px; border-radius: 12px; font-weight: bold; text-decoration: none; text-align: center; font-size: 16px; transition: transform 0.2s; }
    .phone-link { background-color: var(--accent-gold); color: #fff; }
    .kakao-btn { background-color: #fee500; color: #3c1e1e; }
    
    .intro-text { font-size: 16px; line-height: 1.8; margin-bottom: 40px; padding: 30px; background: rgba(255,255,255,0.05); border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
    
    /* 카드를 더 보기 좋게 배치 */
    .card-row { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 30px; }
    @media (min-width: 768px) { .card-row { grid-template-columns: 1fr 1fr; } }
    
    .card { background: var(--card-bg); border-radius: 20px; padding: 30px; color: var(--text-dark); text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    .btn { display: block; padding: 15px; border-radius: 10px; text-decoration: none; font-size: 15px; margin-top: 12px; color: #fff; font-weight: 600; }
    .btn-blue { background-color: #2c3e50; }
    .btn-purple { background-color: #7b4397; }
    
    .beauty-card { background: #e8d0a9; padding: 30px; border-radius: 20px; text-align: center; color: #1a4d32; margin-bottom: 30px; }
    .btn-gold { background-color: var(--accent-gold); color: #fff; display: block; padding: 15px; margin-top: 15px; border-radius: 10px; text-decoration: none; font-weight: bold; }
    
    .family-section { margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 30px; }
    .family-title { font-size: 14px; color: var(--accent-gold); margin-bottom: 15px; font-weight: bold; text-align: center; letter-spacing: 3px; }
    .family-btn { display: inline-block; background: rgba(255,255,255,0.05); color: #fff; padding: 12px 20px; border-radius: 10px; text-decoration: none; margin: 5px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="main-wrapper">
    <div class="brand-header">
      <img src="https://github.com/imdaeho242-bot/imdaeho242-bot.github.io/blob/main/%ED%83%80%EC%9D%B4%ED%8B%80.png?raw=true" alt="휴브릿지 배너" class="title-img">
      <div class="button-group">
        <a href="tel:01064519115" class="phone-link">상담 문의: 010-6451-9115</a>
        <a href="https://pf.kakao.com/_xgEgnX" class="kakao-btn">HJ 카카오톡 상담 바로가기</a>
      </div>
    </div>
    <section class="intro-text">
      휴브릿지는 미용재료, 의료장비, 가전 렌탈 및 자금 지원을 통해 미래를 설계하는 전문 파트너입니다.
    </section>
    <div class="card-row">
      <div class="card"><h3>기업·가전 렌탈</h3><a href="https://blog.naver.com/sora2220" class="btn btn-blue">장비렌탈 blog</a><a href="https://hubridge678.blogspot.com" class="btn btn-blue">의료장비 blog</a></div>
      <div class="card"><h3>상품 판매·중개</h3><a href="http://withmoa.co.kr" class="btn btn-purple">가전 렌탈 바로가기</a><a href="http://www.제로스톤.com" class="btn btn-purple">상품중개 blog</a></div>
    </div>
    <div class="beauty-card"><h3>미용재료</h3><a href="https://blog.naver.com/dlaeogh3" class="btn btn-gold">미용재료 blog 바로가기</a></div>
    <div class="family-section">
      <div class="family-title">FAMILY SITE</div>
      <a href="https://blog.naver.com/haeyoung924" class="family-btn">햇빛 노인 재가 센터 blog</a>
      <a href="https://blog.naver.com/tmdgusdk119" class="family-btn">(주)천리환경 blog</a>
    </div>
  </div>
</body>
</html>
