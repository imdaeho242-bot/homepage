<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>휴브릿지 비즈 24</title>
  
  <style>
    /* 1. 전체 배경 및 기본 폰트 설정 */
    body {
      background-color: #1a4d32; /* 짙은 초록색 메인 배경 */
      margin: 0;
      padding: 40px 15px;
      font-family: 'Malgun Gothic', sans-serif;
      color: #ffffff;
    }
    
    .main-wrapper {
      max-width: 600px;
      margin: 0 auto;
      box-sizing: border-box;
    }

    /* 2. 상단 헤더 영역 (타이틀 및 환영문구) */
    .header-section {
      text-align: center;
      margin-bottom: 35px;
    }
    .header-section h1 {
      font-size: 32px;
      font-weight: bold;
      color: #fffbdf; /* 은은한 노란빛 */
      margin: 0 0 10px 0;
      letter-spacing: -1px;
    }
    .header-section .top-menu {
      font-size: 14px;
      color: #b3d1be;
      margin-bottom: 25px;
    }
    .header-section .welcome-text {
      font-size: 15px;
      line-height: 1.6;
      color: #ffffff;
      margin: 0;
    }

    /* 3. 중간 2단 카드 레이아웃 (기업/가정 렌탈 & 판매/중개) */
    .card-row-2col {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
    }
    
    .white-card {
      background-color: #ffffff;
      border-radius: 25px;
      padding: 20px 15px;
      flex: 1;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 카드 내 이미지와 텍스트를 나란히 배치하는 레이아웃 */
    .card-title-group {
      display: flex;
      align-items: center; /* 수직 중앙 정렬 */
      gap: 10px;
      margin-bottom: 15px;
    }
    
    /* 심볼 이미지 사이즈 설정 */
    .card-icon {
      width: 45px;
      height: 45px;
      object-fit: contain;
    }

    .card-title-text {
      text-align: left;
    }
    .card-title-text h3 {
      font-size: 16px;
      color: #111111;
      margin: 0 0 4px 0;
      font-weight: bold;
      word-break: keep-all;
    }
    .card-title-text p {
      font-size: 12px;
      color: #777777;
      margin: 0;
      word-break: keep-all;
    }

    .btn-green-basic {
      display: block;
      background-color: #1a4d32;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 10px;
      border-radius: 30px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      box-sizing: border-box;
    }
    .btn-green-basic:last-child {
      margin-bottom: 0;
    }

    /* 4. 하단 1단 대형 카드 레이아웃 (미용재료) */
    .large-beauty-card {
      background-color: #ffffff;
      border-radius: 25px;
      padding: 30px 20px;
      box-sizing: border-box;
      margin-bottom: 35px;
      border: 3px solid #c29d6d; /* 황토/골드색 테두리 포인트 */
    }

    .large-card-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    /* 미용재료 썸네일(YIKERU) 사이즈 설정 */
    .large-icon {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }

    .large-text-group {
      text-align: left;
    }
    .large-text-group h2 {
      font-size: 24px;
      color: #111111;
      margin: 0 0 6px 0;
      font-weight: bold;
    }
    .large-text-group p {
      font-size: 14px;
      color: #c29d6d;
      margin: 0;
      font-weight: bold;
    }

    .btn-gold-large {
      display: block;
      width: 100%;
      background-color: #c29d6d;
      color: #ffffff;
      text-decoration: none;
      padding: 15px 0;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      box-sizing: border-box;
    }

    /* 5. 패밀리 사이트 영역 */
    .family-section {
      width: 100%;
      text-align: left;
    }
    .family-section .title-text {
      font-size: 15px;
      font-weight: bold;
      color: #a4c4b5;
      margin: 0 0 12px 10px;
      border-left: 3px solid #c29d6d;
      padding-left: 8px;
    }
    .family-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-family-style {
      display: block;
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      text-decoration: none;
      padding: 15px 20px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: bold;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <div class="main-wrapper">
    
    <div class="header-section">
      <h1>휴브릿지 비즈 24</h1>
      <div class="top-menu">미용재료 · 기업/가정 렌탈 · 상품중개</div>
      <p class="welcome-text">
        휴브릿지 비즈 24 공식 홈페이지를 방문해 주셔서 진심으로 감사합니다.<br>
        저희 공식 홈페이지에 오신 것을 환영합니다.
      </p>
    </div>

    <div class="card-row-2col">
      
      <div class="white-card">
        <div class="card-title-group">
          <img src="렌탈장비이미지.jpg" alt="장비렌탈 기호" class="card-icon">
          <div class="card-title-text">
            <h3>기업·가정 렌탈</h3>
            <p>운영 및 생활 가전 지원</p>
          </div>
        </div>
        <div>
          <a href="https://blog.naver.com/sora2220" target="_blank" class="btn-green-basic">장비렌탈 바로가기</a>
          <a href="http://withmoa.co.kr" target="_blank" class="btn-green-basic">가전 렌탈 바로가기</a>
        </div>
      </div>

      <div class="white-card">
        <div class="card-title-group">
          <img src="제로스톤이미지.jpg" alt="판매중개 기호" class="card-icon">
          <div class="card-title-text">
            <h3>판매·중개</h3>
            <p>음식물처리 기기<br>자료 보기</p>
          </div>
        </div>
        <div>
          <a href="https://www.제로스톤.com" target="_blank" class="btn-green-basic">상품중개 바로가기</a>
        </div>
      </div>

    </div>

    <div class="large-beauty-card">
      <div class="large-card-group">
