  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }

    body {
      background: #1f2937;
      color: #111827;
    }

    .hero {
      min-height: 100vh;
      padding: 70px 30px;
      background:
   linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.4)),
   linear-gradient(135deg, #2e5a44, #1c3d2e, #0b1a12);  
      background-size: cover;
      background-position: center;
    }

    .title {
      text-align: center;
      color: #f5d28a;
      font-size: 48px;
      font-weight: 900;
      margin-bottom: 15px;
      text-shadow: 0 4px 12px rgba(0,0,0,0.7);
    }

    .subtitle {
      text-align: center;
      color: white;
      font-size: 22px;
      margin-bottom: 50px;
      font-weight: 600;
    }

    .card-wrap {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .card {
      background: rgba(255,255,255,0.86);
      border-radius: 26px;
      padding: 35px 25px;
      text-align: center;
      min-height: 300px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.35);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card h2 {
      font-size: 28px;
      margin-bottom: 20px;
      color: #111827;
      font-weight: 900;
    }

    .card p {
      font-size: 17px;
      line-height: 1.7;
      color: #1f2937;
      font-weight: 600;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      padding: 14px 32px;
      border-radius: 999px;
      background: #3b82f6;
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: 800;
    }

    .family {
      max-width: 1000px;
      margin: 60px auto 0;
      padding: 40px 30px;
      background: rgba(255,255,255,0.88);
      border-radius: 30px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.35);
    }

    .family h2 {
      font-size: 34px;
      color: #111827;
      margin-bottom: 10px;
      font-weight: 900;
    }

    .family > p {
      font-size: 18px;
      color: #374151;
      margin-bottom: 30px;
      font-weight: 600;
    }

    .family-wrap {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 25px;
    }

    .family-card {
      background: white;
      border-radius: 24px;
      padding: 30px 25px;
      min-height: 230px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.18);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .family-card h3 {
      font-size: 27px;
      margin-bottom: 18px;
      color: #111827;
      font-weight: 900;
    }

    .family-card p {
      font-size: 16px;
      line-height: 1.7;
      color: #374151;
      font-weight: 600;
      margin-bottom: 24px;
    }

    @media screen and (max-width: 900px) {
      .hero {
        padding: 45px 18px;
      }

      .title {
        font-size: 34px;
      }

      .subtitle {
        font-size: 18px;
      }

      .card-wrap {
        grid-template-columns: 1fr;
      }

      .family-wrap {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: auto;
      }
    }

.consult-main-btn { */
  position: fixed;
  bottom: 20px;
  right: 20px;
  background-color: #ffffff;
  color: #ff6f61;
  padding: 12px 24px;
  border: 2px solid #ff6f61;
  border-radius: 25px;

  font-size: 16px;

  z-index: 9999;
  transition: all 0.3s ease;
}

.consult-main-btn:hover { 
  background-color: #ff6f61;
  color: #ffffff;
}
modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background-color: rgba(0, 0, 0, 0.7);
  z-index: 10000;
  justify-content: center;
  align-items: center;
}
.modal-content {
  background-color: #1e1e24;
  color: #ffffff;
  padding: 30px;
  border-radius: 15px;
  width: 90%;
  max-width: 450px;
  position: relative;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  box-sizing: border-box;
}
.close-btn {
  position: absolute;
  top: 15px; right: 20px;
  font-size: 28px;
  cursor: pointer;
  color: #aaa;
}
.close-btn:hover { color: #fff; }
.input-group {
  margin-bottom: 15px;
  text-align: left;
}
.input-group label {
  display: block;
  margin-bottom: 5px;
  font-size: 14px;
  color: #ccc;
}
.input-group input, .input-group select, .input-group textarea {
  width: 100%;
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #444;
  background-color: #2a2a32;
  color: white;
  box-sizing: border-box;
}
.submit-btn {
  width: 100%;
  background-color: #ff6f61;
  color: white;
  padding: 12px;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
.submit-btn:hover { background-color: #e55b4e; }
   .live-chat-btn {
    position: fixed;       /* 화면에 움직이지 않게 고정 */
    bottom: 30px;          /* 화면 맨 아래에서 30픽셀 위로 */
    right: 30px;           /* 화면 맨 오른쪽에서 30픽셀 왼쪽으로 */
    padding: 12px 20px;    /* 버튼 안쪽 여백 (통통하게) */
    background-color: #2e5a44; /* 아까 고르신 세련된 초록색 배경 */
    color: white;          /* 글자 색상은 하얗게 */
    text-decoration: none; /* 글자 밑줄 제거 */
    border-radius: 50px;   /* 버튼 모서리를 둥글게 동그라미로 */
    font-weight: bold;     /* 글씨 두껍게 */
    z-index: 9999;         /* 다른 어떤 화면 요소보다 맨 위에 뜨게 */
    box-shadow: 0 4px 10px rgba(0,0,0,0.2); /* 버튼 아래 은은한 그림자 */
}
</style>
