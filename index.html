<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비즈링크 365</title>
    <style>
        /* 1. 전체 배경 및 기본 세팅 */
        body {
            margin: 0;
            padding: 20px 10px;
            background-color: #0d3b26; /* 이미지의 짙은 그린 배경색 */
            font-family: 'Malgun Gothic', dotum, sans-serif;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
        }

        /* 2. 전체를 감싸는 컨테이너 */
        .container {
            width: 100%;
            max-width: 450px; /* 모바일 화면에 최적화된 너비 */
            text-align: center;
        }

        /* 3. 메인 및 서브 타이틀 영역 */
        .header-title {
            color: #f3c477; /* 금빛/황토색 타이틀 */
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .header-sub {
            color: #ffffff;
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        /* 4. 상단 2열 카드를 배치하는 그리드 */
        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        /* 5. 공통 카드 스타일 (둥근 모서리) */
        .card {
            background-color: #ffffff;
            border-radius: 30px;
            padding: 25px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        /* 6. 하단 미용재료 전용 와이드 카드 스타일 */
        .card-wide {
            background: linear-gradient(to bottom, #fffde9, #f5e4ab); /* 은은한 노란색 그라데이션 */
            border-radius: 30px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }

        /* 7. 카드 제목 및 설명 텍스트 */
        .card-title {
            color: #000000;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .card-wide .card-title {
            font-size: 22px;
        }
        .card-desc {
            color: #555555;
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 15px;
            min-height: 36px;
        }

        /* 8. 버튼 그룹 및 버튼 공통 스타일 */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 6px; /* 버튼 사이의 간격 */
            width: 100%;
            align-items: center;
        }
        .btn {
            display: inline-block;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            padding: 9px 15px;
            border-radius: 20px;
            color: #ffffff;
            width: 85%;
            text-align: center;
            transition: background 0.2s;
            box-sizing: border-box;
        }

        /* 9. 버튼 색상 정의 */
        .btn-green { background-color: #24523b; }
        .btn-lightgreen { background-color: #3a7d5c; } /* 가전 렌탈 전용 연한 그린 */
        .btn-dark { background-color: #333333; }
        .btn-yellow { background-color: #b38900; }
        .btn:hover { opacity: 0.9; }

        /* 10. 최하단 소형 링크 영역 스타일 */
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            width: 100%;
        }
        .footer-btn {
            display: inline-block;
            text-decoration: none;
            font-size: 11px; /* 작고 앙증맞은 크기 */
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4); /* 은은한 흰색 테두리 */
            padding: 6px 12px;
            border-radius: 6px;
            background-color: rgba(255, 255, 255, 0.05);
            transition: background 0.2s;
            box-sizing: border-box;
        }
        .footer-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">비즈링크 365</div>
    <div class="header-sub">미용재료 · 기업/가정 렌탈 · 상품중개</div>

    <div class="grid-2col">
        <div class="card">
            <div class="card-title">기업·가정 렌탈</div>
            <div class="card-desc">기업, 생활가전<br>운영 지원</div>
            <div class="btn-group">
                <a href="https://blog.naver.com/sora2220" class="btn btn-green">렌탈 바로가기</a>
                <a href="http://withmoa.co.kr" class="btn btn-lightgreen">가전 렌탈 바로가기</a>
            </div>
        </div>

        <div class="card">
            <div class="card-title">상품 중개</div>
            <div class="card-desc">필요한 상품<br>연결 상담</div>
            <div class="btn-group">
                <a href="https://m.mybox.naver.com/mobile/share/list/doc-viewer/ZGxhZW9naDN8MzQ3MjU5OTE5OTgyMDY5MzU2OHxGfDA?shareKey=QP5RlW0dAPNb6P3t_aE9qZO00KyCMwGoX5lTFefQpa45jISR6XeU-08UhhpnJ9DuVin0Ri-KQ3FUcArELzN9lQI%3D" class="btn btn-dark" style="width: 90%; padding: 12px 15px;">상품중개 바로가기</a>
            </div>
        </div>
    </div>

    <div class="card-wide">
        <div class="card-title">미용재료</div>
        <div class="card-desc">미용재료 및<br>클리닉 제품</div>
        <a href="https://blog.naver.com/dlaeogh3" class="btn btn-yellow" style="width: auto; padding: 10px 30px; font-size: 13px;">미용재료 바로가기</a>
    </div>

    <div class="footer-links">
        <a href="https://blog.naver.com/haeyoung924" class="footer-btn">햇빛 노인재가센터 바로가기</a>
        <a href="https://m.blog.naver.com/tmdgusdk119" class="footer-btn">천리환경 바로가기</a>
    </div>
</div>

</body>
</html>
