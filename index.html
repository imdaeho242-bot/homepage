<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비즈니스 종합 플랫폼</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #0b3a28, #061b13);
      color: white;
    }

    .wrap {
      min-height: 100vh;
      padding: 45px 18px 60px;
      text-align: center;
    }

    h1 {
      color: #e6b56d;
      font-size: 30px;
      margin: 0 0 12px;
      font-weight: 900;
    }

    .subtitle {
      font-size: 15px;
      margin-bottom: 35px;
      color: #ffffff;
    }

    .card-area {
      max-width: 430px;
      margin: 0 auto;
    }

    .row {
      display: flex;
      gap: 14px;
      margin-bottom: 18px;
    }

    .card {
      background: #f4f4f4;
      color: #111;
      border-radius: 35px;
      padding: 28px 14px;
      box-shadow: 0 12px 25px rgba(0,0,0,0.25);
      flex: 1;
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .main-card {
      background: linear-gradient(180deg, #fff5d7, #ead89d);
      width: 78%;
      margin: 0 auto;
      min-height: 210px;
      border-radius: 45px;
    }

    .card h2 {
      font-size: 21px;
      margin: 0 0 10px;
      font-weight: 900;
      color: #000;
    }

    .card p {
      font-size: 14px;
      line-height: 1.45;
      margin: 0 0 16px;
      color: #222;
    }

    .card a {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 30px;
      color: white;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
    }

    .rental a {
      background: #31583f;
    }

    .broker a {
      background: #333333;
    }

    .beauty a {
      background: #b78b05;
      font-size: 15px;
      padding: 12px 20px;
    }

    .bottom-links {
      max-width: 430px;
      margin: 35px auto 0;
      padding-top: 22px;
      border-top: 1px solid rgba(255,255,255,0.3);
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .bottom-links a {
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 800;
      padding: 12px 18px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.08);
    }

    @media (max-width: 390px) {
      h1 {
        font-size: 26px;
      }

      .subtitle {
        font-size: 13px;
      }

      .row {
        gap: 10px;
      }

      .card {
        padding: 24px 10px;
      }

      .card h2 {
        font-size: 18px;
      }

      .card p {
        font-size: 13px;
      }

      .card a {
        font-size: 12px;
        padding: 9px 11px;
      }

      .bottom-links a {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <h1>비즈니스 종합 플랫폼</h1>

    <div class="subtitle">
      미용재료 · 기업/가정 렌탈 · 상품중개
    </div>

    <div class="card-area">

      <div class="row">

        <div class="card rental">
          <div>
            <h2>기업·가정 렌탈</h2>
            <p>기업, 생활가전<br>운영 지원</p>
            <a href="https://여기에-렌탈-주소" target="_blank">
              렌탈 바로가기
            </a>
          </div>
        </div>

        <div class="card broker">
          <div>
            <h2>상품 중개</h2>
            <p>필요한 상품<br>연결 상담</p>
            <a href="https://여기에-상품중개-주소" target="_blank">
              상품중개 바로가기
            </a>
          </div>
        </div>

      </div>

      <div class="card main-card beauty">
        <div>
          <h2>미용재료</h2>
          <p>미용재료 및<br>클리닉 제품</p>
          <a href="https://여기에-미용재료-주소" target="_blank">
            미용재료 바로가기
          </a>
        </div>
      </div>

    </div>

    <div class="bottom-links">
      <a href="https://여기에-천리환경-주소" target="_blank">
        천리환경 바로가기
      </a>

      <a href="https://여기에-햇빛노인재가센터-주소" target="_blank">
        햇빛 노인 재가 센터 바로가기
      </a>
    </div>

  </div>
</body>
</html>
