<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비즈니스 종합 플랫폼</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: radial-gradient(circle at top, #124530 0%, #061d14 75%);
      color: #111;
    }

    .wrap {
      min-height: 100vh;
      padding: 45px 16px 70px;
    }

    .main-title {
      text-align: center;
      margin-bottom: 34px;
    }

    .main-title h1 {
      margin: 0;
      color: #e7b870;
      font-size: 29px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .main-title p {
      margin-top: 12px;
      color: #fff;
      font-size: 15px;
    }

    .card-area {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .top-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      gap: 14px;
    }

      min-height: 190px;
      border-radius: 45px;
      padding: 28px 14px;
      text-align: center;

      border: 1px solid rgba(255,255,255,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
    }
