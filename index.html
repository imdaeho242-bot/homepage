<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>휴브릿지 비즈 24</title>
  <style>
    /* 전체 배경을 다시 원래 의도하신 짙은 녹색으로 잡았습니다 */
    body { background-color: #1a4d32; margin: 0; padding: 40px 15px; font-family: 'Malgun Gothic', sans-serif; color: #ffffff; }
    .main-wrapper { max-width: 600px; margin: 0 auto; }
    .header-section { text-align: center; margin-bottom: 35px; color: #ffffff; }
    h1 { color: #fffbdf; font-size: 32px; }
    
    /* 카드들의 배경색을 흰색으로 고정하고 글자색을 검은색(#111)으로 강제 설정했습니다 */
    .white-card { background-color: #ffffff; border-radius: 25px; padding: 20px; margin-bottom: 20px; color: #111111; }
    .large-beauty-card { background-color: #ffffff; border-radius: 25px; padding: 30px 20px; margin-bottom: 35px; border: 3px solid #c29d6d; color: #111111; }
    
    /* 글자색이 안 보일 때를 대비해 모든 글자색을 설정 */
    .card-title-text h3, .large-text-group h2, .large-text-group p { color: #111111; }
    
    /* 버튼 스타일 */
    .btn-green-basic { display: block; background-color: #1a4d32; color: #ffffff; text-align: center; padding: 12px; border-radius: 30px; text-decoration: none; margin-top: 10px; font-weight: bold; }
    .btn-gold-large { display: block; background-color: #c29d6d; color: #ffffff; text-align: center; padding: 15px; border-radius: 30px; text-decoration: none; margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="main-wrapper">
    <div class="header-section">
      <h1>휴브릿지 비즈 24</h1>
      <p>저희 공식 홈페이지에<br>오신 것을 환영합니다.</p>
    </div>
    
    <div class="white-card">
      <h3>기업·가정 렌탈</h3>
      <a href="https://blog.naver.com/sora2220" class="btn-green-basic">장비렌탈 바로가기</a>
    </div>

    <div class="large-beauty-card">
      <h2>미용재료</h2>
      <p>미용재료 및 클리닉 제품 공급</p>
      <a href="https://blog.naver.com/dlaeogh3" class="btn-gold-large">미용재료 바로가기</a>
    </div>
  </div>
</body>
</html>
