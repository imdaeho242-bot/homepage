<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>휴브릿지 비즈 24</title>
  <style>
    :root { 
      --main-bg: #0f2027; 
      --accent-gold: #c5a059; 
      --card-bg: #ffffff; 
      --text-main: #ffffff; 
      --text-dark: #333333; 
    }
    
    body { background-color: var(--main-bg) !important; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; color: var(--text-main); }
    
    /* 핵심 수정: 최대 너비를 1200px 이상으로 넓히고 유연하게 설정 */
    .main-wrapper { 
        width: 95%; 
        max-width: 1200px; 
        margin: 0 auto; 
        padding: 40px 0; 
    }
    
    .brand-header { text-align: center; margin-bottom: 40px; }
    .title-img { width: 100%; max-width: 100%; height: auto; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    
    .button-group { 
        display: flex; flex-direction: column; gap: 20px; 
        margin: 30px auto; max-width: 100%; 
    }
    @media (min-width: 600px) { .button-group { flex-direction: row; } }
    
    .phone-link, .kakao-btn { 
        flex: 1; padding: 20px; border-radius: 12px; font-weight: bold; text-decoration: none; text-align: center; font-size: 18px; 
    }
    .phone-link { background-color: var(--accent-gold); color: #fff; }
    .kakao-btn { background-color: #fee500; color: #3c1e1e; }
    
    .intro-text { 
        font-size: 1.2rem; line-height: 1.8; margin-bottom: 40px; 
        padding: 40px; background: rgba(255,255,255,0.05); 
        border-radius: 20px; text-align: center;
    }
    
    /* 그리드 설정: 화면이 커지면 2단으로, 작으면 1단으로 자동 변경 */
    .card-row { 
        display: grid; grid-template-columns: 1fr; gap: 30px; 
        margin-bottom: 30px;
    }
    @media (min-width: 768px) { .card-row { grid-template-columns: 1fr 1fr; } }
    
    .card { background: var(--card-bg); border-radius: 20px; padding: 40px; color: var(--text-dark); text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    .btn { display: block; padding: 15px; border-radius: 10px; text-decoration: none; font-size: 16px; margin-top: 15px; color: #fff; font-weight: 600; }
    .btn-blue { background-color: #2c3e50; }
    .btn-purple { background-color: #7b4397; }
    
    .beauty-card { 
        background: #e8d0a9; padding: 40px; border-radius: 20px; 
        text-align: center; color: #1a4d32; margin: 0 auto 30px auto; 
    }
    .btn-gold { background-color: var(--accent-gold); color: #fff; display: block; padding: 15px; margin-top: 20px; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 16px; }
    
    .family-section { margin-top: 50px; text-align: center; }
    .family-title { font-size: 16px; color: var(--accent-gold); margin-bottom: 20px; font-weight: bold; letter-spacing: 5px; }
    .family-btn { display: inline-block; background: rgba(255,255,255,0.1); color: #fff; padding: 15px 30px; border-radius: 10px; text-decoration: none; margin: 10px; font-size: 16px; }
  </style>
</head>
<body>
  <div class="main-wrapper">
    <div class="brand-header">
      <img src="https://github.com/imdaeho242-bot/imdaeho242-bot.github.io/blob/main/%ED%83%80%EC%9D%B4%ED%8B%80.png?raw=true" alt="휴브릿지 배너" class="title-img">
      <div class="button-group">
        <a href="tel:01064519115" class="phone-link">상담 문의: 010-6451-9115</a>
        <a href="https://pf.kakao.com/_xgEgnX" class="kakao-btn">HU 카카오톡 상담 바로가기</a>
      </div>
    </div>
    <section class="intro-text">
      "휴브릿지는 미용.의료.가전 렌탈 및 금융 솔루션으로 고객의 성공적인 내일을 함께 설계하는 든든한 파트너입니다."
    </section>
    <div class="card-row">
      <div class="card"><h3>기업·가전 렌탈</h3><a href="https://blog.naver.com/sora2220" class="btn btn-blue">장비렌탈 blog 바로가기</a><a href="https://hubridge678.blogspot.com" class="btn btn-blue">의료관련 blog 바로가기</a></div>
      <div class="card"><h3>가전 렌탈.중개</h3><a href="http://withmoa.co.kr" class="btn btn-purple">가전 렌탈 바로가기</a><a href="http://www.제로스톤.com" class="btn btn-purple">상품중개 </a></div>
    </div>
    <div class="beauty-card"><h3>미용재료</h3><a href="https://blog.naver.com/dlaeogh3" class="btn btn-gold">미용재료 blog 바로가기</a></div>
    <div class="family-section">
      <div class="family-title">FAMILY SITE</div>
      <a href="https://blog.naver.com/haeyoung924" class="family-btn">햇빛 노인 재가 센터 </a>
      <a href="https://blog.naver.com/tmdgusdk119" class="family-btn">(주)천리환경 </a>
    </div>
  </div>
</body>
</html>
