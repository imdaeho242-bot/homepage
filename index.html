<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>비즈니스 종합 플랫폼</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Noto Sans KR", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #111;
      color: #111;
    }

    .hero {
      min-height: 100vh;
      padding: 80px 40px;
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.55)),
        url("background.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .hero-title {
      text-align: center;
      color: #f5d28a;
      font-size: 48px;
      font-weight: 900;
      margin-bottom: 18px;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.65);
    }

    .hero-subtitle {
      text-align: center;
      color: #f3f4f6;
      font-size: 22px;
      margin-bottom: 55px;
      text-shadow: 0 3px 8px rgba(0, 0, 0, 0.65);
    }

    .main-card-wrap {
      width: 100%;
      max-width: 1250px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    .business-card {
      min-height: 320px;
      padding: 35px 28px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
      text-align: center;
      backdrop-filter: blur(7px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .business-card h2 {
      font-size: 30px;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 22px;
    }

    .business-card p {
      font-size: 17px;
      line-height: 1.65;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-block;
      padding: 15px 34px;
      border-radius: 999px;
      background: linear-gradient(135deg, #3b82f6, #60a5fa);
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35);
      transition: 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #2563eb, #3b82f6);
    }

    .family-platform {
      width: 100%;
      max-width: 1050px;
      margin: 60px auto 0;
      padding: 40px 35px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.80);
      border: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
      text-align: center;
    }

    .family-platform h2 {
      font-size: 34px;
      font-weight: 900;
      color: #111827;
      margin-bottom: 10px;
    }

    .family-platform .family-subtitle {
      font-size: 18px;
      color: #374151;
      margin-bottom: 32px;
      font-weight: 600;
    }

    .family-card-wrap {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 28px;
    }

    .family-card {
      min-height: 230px;
      padding: 32px 26px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(220, 220, 220, 0.8);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .family-card h3 {
      font-size: 27px;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 18px;
    }

    .family-card p {
      font-size: 16px;
      line-height: 1.65;
      color: #374151;
      font-weight: 600;
      margin-bottom: 24px;
    }
