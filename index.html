<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>휴브릿지 비즈 24</title>
  <style>
    :root { 
      /* 은은하고 세련된 그라데이션 배경색 */
      --bg-gradient: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
      --accent-gold: #c5a059; 
      --text-main: #1e293b; 
      --card-shadow: 0 10px 30px rgba(0,0,0,0.05); 
    }
    
    body { 
        background: var(--bg-gradient); 
        background-attachment: fixed; /* 배경 고정으로 모바일에서도 풍성하게 */
        margin: 0; padding: 0; 
        font-family: 'Pretendard', sans-serif; 
        color: var(--text-main); 
        font-size: 1.25rem; 
        line-height: 1.8; 
    }
    
    .main-wrapper { 
        width: 90%; 
        max-width: 1100px; 
        margin: 0 auto; 
        padding: 60px 0; 
    }
    
    .brand-header { text-align: center; margin-bottom: 60px; }
    .title-img { width: 100%; max-width: 900px; height: auto; border-radius: 20px; box-shadow: var(--card-shadow); }
    
    .button-group { 
        display: flex; gap: 20px; 
        margin: 40px auto 0; max-width: 800px; 
    }
    @media (max-width: 768px) { .button-group { flex-direction: column; } }
    
    .phone-link, .kakao-btn { 
        flex: 1; padding: 22px; border-radius: 16px; font-weight: 700; text-decoration: none; text-align: center; font-size: 1.2rem; 
    }
    .phone-link { background-color: var(--accent-gold); color: #fff; }
    .kakao-btn { background-color: #fee500; color: #333; }
    
    .intro-text { 
        font-size: 1.6rem; 
        font-weight: 600;
        line-height: 1.5; margin-bottom: 60px; 
        padding: 50px; background: rgba(255,255,255,0.8); 
        border-radius: 24px; text-align: center; color: #2d3436;
        box-shadow: var(--card-shadow);
    }
    
    .card-row { 
        display: grid; grid-template-columns: 1fr 1fr; gap: 30px; 
        margin-bottom: 30px;
    }
    @media (max-width: 768px) { .card-row { grid-template-columns: 1fr; } }
    
    .card { background: rgba(255,255,255,0.9); border-radius: 24px; padding: 40px; text-align: center; box-shadow: var(--card-shadow); }
    .card h3 { font-size: 1.7rem; margin-top: 0; }
    
    .btn { display: block; padding: 18px; border-radius: 12px; text-decoration: none; font-size: 1.15rem; margin-top: 20px; color: #fff; font-weight: 600; }
    .btn-blue { background-color: #34495e; }
    .btn-purple { background-color: #8e44ad; }
    
    .beauty-card { 
        background: rgba(255,255,255,0.9); border: 2px solid var(--accent-gold); padding: 40px; border-radius: 24px; 
        text-align: center; margin: 30px auto; box-shadow: var(--card-shadow);
    }
    .beauty-card h3 { font-size: 1.7rem; margin-top: 0; }
    .btn-gold { background-color: var(--accent-gold); color: #fff; display: block; padding: 18px; margin-top: 20px; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 1.2rem; }
    
    .family-section { margin-top: 70px; text-align: center; }
    .family-title { font-size: 1rem; color: #636e72; margin-bottom: 20px; font-weight: bold; letter-spacing: 5px; }
    .family-btn { display: inline-block; background: rgba(255,255,255,0.6); color: #444; padding: 15px 30px; border-radius: 12px; text-decoration: none; margin: 8px; font-size: 1.1rem; }
  </style>
</head>
<body>
  <div class="main-wrapper">
    <div class="brand-header">
      <img src="https://github.com/imdaeho242-bot/imdaeho242-bot.github.io/blob/main/%ED%83%80%EC%9D%B4%ED%8B%80.png?raw=true" alt="휴브릿지 배너" class="title-img">
      <div class="button-group">
        <a href="tel:01064519115" class="phone-link">상담 문의: 010-6451-9115</a>
        <a href="https://pf.kakao.com/_xgEgnX" class="kakao-btn">HU 카카오톡 상담 바로가기</a>
      </div>
    </div>
    
    <section class="intro-text">
      "휴브릿지는 미용·의료·가전 렌탈 및 금융 솔루션으로<br>고객의 성공적인 내일을 함께 만들어 가겠습니다."
    </section>
    
    <div class="card-row">
      <div class="card">
        <h3>기업·가전 렌탈</h3>
        <a href="https://blog.naver.com/sora2220" class="btn btn-blue">장비렌탈 blog 바로가기</a>
        <a href="https://hubridge678.blogspot.com" class="btn btn-blue">의료관련 blog 바로가기</a>
      </div>
      <div class="card">
        <h3>가전 렌탈·중개</h3>
        <a href="http://withmoa.co.kr" class="btn btn-purple">가전 렌탈 바로가기</a>
        <a href="http://www.제로스톤.com" class="btn btn-purple">상품중개 </a>
      </div>
    </div>
    
    <div class="beauty-card">
      <h3>미용재료</h3>
      <a href="https://blog.naver.com/dlaeogh3" class="btn btn-gold">미용재료 blog 바로가기</a>
    </div>
    
    <div class="family-section">
      <div class="family-title">FAMILY SITE</div>
      <a href="https://blog.naver.com/haeyoung924" class="family-btn">햇빛 노인 재가 센터 </a>
      <a href="https://blog.naver.com/tmdgusdk119" class="family-btn">(주)천리환경 </a>
    </div>
  </div>
</body>
</html>
