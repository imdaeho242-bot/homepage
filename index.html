<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비즈니스 종합 플랫폼</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: radial-gradient(circle at top, #124530 0%, #061d14 75%);
      color: #111;
    }

    .wrap {
      min-height: 100vh;
      padding: 45px 16px 70px;
    }

    .main-title {
      text-align: center;
      margin-bottom: 34px;
    }

    .main-title h1 {
      margin: 0;
      color: #e7b870;
      font-size: 29px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .main-title p {
      margin-top: 12px;
      color: #fff;
      font-size: 15px;
    }

    .card-area {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .top-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      gap: 14px;
    }

    .circle-card {
      width: 100%;
      min-height: 190px;
      border-radius: 45px;
      padding: 28px 14px;
      text-align: center;
      box-shadow: 0 14px 30px rgba(0,0,0,0.28);
      border: 1px solid rgba(255,255,255,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .small-card {
      width: 50%;
      min-height: 210px;
      border-radius: 44px;
      background: linear-gradient(180deg, #ffffff 0%, #e4e4e4 100%);
    }

    .main-card {
      width: 78%;
      min-height: 230px;
      border-radius: 55px;
      background: linear-gradient(180deg, #fff7dc 0%, #ead79c 100%);
      margin-top: -8px;
      position: relative;
      z-index: 5;
    }

    .circle-card h2 {
      margin: 0 0 10px;
      font-size: 21px;
      font-weight: 900;
      color: #000;
      line-height: 1.25;
      word-break: keep-all;
    }

    .circle-card p {
      margin: 0 0 16px;
      font-size: 14px;
      line-height: 1.45;
      color: #222;
      word-break: keep-all;
    }

    .circle-card a {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 999px;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      line-height: 1.2;
      word-break: keep-all;
    }

    .rental a {
      background: #31583f;
    }

    .broker a {
      background: #333333;
    }

    .beauty a {
      background: #b78b05;
      font-size: 15px;
      padding: 12px 20px;
    }

    .bottom-links {
      max-width: 430px;
      margin: 34px auto 0;
      padding-top: 22px;
      border-top: 1px solid rgba(255,255,255,0.28);
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .bottom-links a {
      color: #f1f1f1;
      text-decoration: none;
      font-size: 16px;
      font-weight: 800;
      padding: 12px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.08);
    }

    @media (min-width: 769px) {
      .wrap {
        padding-top: 65px;
      }

      .main-title h1 {
        font-size: 42px;
      }

      .main-title p {
        font-size: 19px;
      }

      .card-area {
        max-width: 820px;
        gap: 24px;
      }

      .top-row {
        gap: 28px;
      }

      .small-card {
        min-height: 280px;
        border-radius: 70px;
      }

      .main-card {
        width: 48%;
        min-height: 300px;
        border-radius: 80px;
      }

      .circle-card h2 {
        font-size: 30px;
      }

      .circle-card p {
        font-size: 18px;
      }

      .circle-card a {
        font-size: 17px;
        padding: 14px 24px;
      }

      .bottom-links {
        max-width: 820px;
      }

      .bottom-links a {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="main-title">
      <h1>비즈니스 종합 플랫폼</h1>
      <p>미용재료 · 기업/가정 렌탈 · 상품중개</p>
    </div>

    <div class="card-area">

      <div class="top-row">

        <div class="circle-card small-card rental">
          <div>
            <h2>기업·가정 렌탈</h2>
            <p>기업, 생활가전<br>운영 지원</p>
            <a href="https://여기에-렌탈-주소" target="_blank">
              기업·가정 렌탈 바로가기
            </a>
          </div>
        </div>

        <div class="circle-card small-card broker">
          <div>
            <h2>상품 중개</h2>
            <p>필요한 상품<br>연결 상담</p>
            <a href="https://여기에-상품중개-주소" target="_blank">
              상품 중개 바로가기
            </a>
          </div>
        </div>

      </div>

      <div class="circle-card main-card beauty">
        <div>
          <h2>미용재료</h2>
          <p>미용재료 및<br>클리닉 제품</p>
          <a href="https://여기에-미용재료-주소" target="_blank">
            미용재료 바로가기
          </a>
        </div>
      </div>

    </div>

    <div class="bottom-links">
      <a href="https://여기에-천리환경-주소" target="_blank">
        천리환경 바로가기
      </a>

      <a href="https://여기에-햇빛노인재가센터-주소" target="_blank">
        햇빛 노인 재가 센터 바로가기
      </a>
    </div>

  </div>
</body>
</html>
