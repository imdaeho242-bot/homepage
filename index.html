<style>
  /* 1. 배경 화면 설정 및 밝기 보정 */
  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    /* 풍경 이미지를 배경으로 깔고 전체 화면에 꽉 차게 설정 */
    background-image: url('bg-river.png'); 
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    /* 어두운 곳을 밝게 하고 화질을 선명하게 보정 (밝기 120%, 대비 110%) */
    backdrop-filter: brightness(1.2) contrast(1.1);
    -webkit-backdrop-filter: brightness(1.2) contrast(1.1);
    
    /* 화면 중앙 정렬 */
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* 2. 모바일 화면에서 네모난 상자 꽉 차게 키우기 */
  .container, .main-card, div[style*="margin"] { 
    width: 100% !important; /* 가로 너비 꽉 채움 */
    height: 100vh !important; /* 스마트폰 높이에 딱 맞춤 */
    max-width: 480px; /* PC에서 너무 퍼지지 않게 잡아주는 마지노선 */
    box-sizing: border-box;
    margin: 0 !important; /* 외부 여백 제거 */
    border-radius: 0 !important; /* 화면에 꽉 찰 때는 모서리 둥근 것을 펴줌 */
    
    /* 내부 내용들이 잘 보이도록 정렬 */
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow-y: auto; /* 내용이 길어지면 스크롤 가능하게 */
    background-color: rgba(0, 128, 0, 0.9); /* 기존 초록색 배경 유지 및 투명도 조절 */
  }

  /* 3. 상자 안의 이미지들도 가로로 꽉 차게 조절 */
  img {
    width: 100% !important;
    height: auto !important;
  }
</style>
