<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비즈니스 종합 플랫폼</title>
    <style>
        /* 전체 배경 및 기본 세팅 */
        body {
            margin: 0;
            padding: 20px 10px;
            background-color: #0d3b26; /* 이미지의 짙은 그린 배경색 */
            font-family: 'Malgun Gothic', dotum, sans-serif;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
        }

        /* 전체를 감싸는 컨테이너 */
        .container {
            width: 100%;
            max-width: 450px; /* 모바일 화면에 최적화된 너비 */
            text-align: center;
        }

        /* 메인 타이틀 영역 */
        .header-title {
            color: #f3c477; /* 금빛/황토색 타이틀 */
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        /* 서브 타이틀 영역 */
        .header-sub {
            color: #ffffff;
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        /* 2열 카드를 나란히 배치하기 위한 그리드 */
        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        /* 공통 카드 스타일 */
        .card {
            background-color: #ffffff;
            border-radius: 30px; /* 둥근 모서리 */
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        /* 하단 미용재료 전용 와이드 카드 스타일 */
        .card-wide {
            background: linear-gradient(to bottom, #fffde9, #f5e4ab); /* 은은한 노란색 그라데이션 */
            border-radius: 30px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-top: 4px;
        }

        /* 카드 제목 */
        .card-title {
            color: #000000;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .card-wide .card-title {
            font-size: 22px; /* 하단 카드는 글씨를 조금 더 크게 */
        }

        /* 카드 설명 텍스트 */
        .card-desc {
            color: #555555;
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 20px;
            min-height: 36px; /* 2줄 높이 고정으로 카드 균형 맞춤 */
        }

        /* 공통 버튼 스타일 */
        .btn {
            display: inline-block;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 20px;
            color: #ffffff;
            transition: background 0.2s;
        }

        /* 버튼별 색상 정의 */
        .btn-green { background-color: #24523b; }
        .btn-dark { background-color: #333333; }
        .btn-yellow { background-color: #b38900; }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">비즈니스 종합 플랫폼</div>
    <div class="header-sub">미용재료 · 기업/가정 렌탈 · 상품중개</div>

    <div class="grid-2col">
        <div class="card">
            <div class="card-title">기업·가정 렌탈</div>
            <div class="card-desc">기업, 생활가전<br>운영 지원</div>
            <a href="#" class="btn btn-green">렌탈 바로가기</a>
        </div>

        <div class="card">
            <div class="card-title">상품 중개</div>
            <div class="card-desc">필요한 상품<br>연결 상담</div>
            <a href="#" class="btn btn-dark">상품중개 바로가기</a>
        </div>
    </div>

    <div class="card-wide">
        <div class="card-title">미용재료</div>
        <div class="card-desc">미용재료 및<br>클리닉 제품</div>
        <a href="#" class="btn btn-yellow">미용재료 바로가기</a>
    </div>
</div>

</body>
</html>
