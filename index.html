<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>휴브릿지 비즈 24</title>
  <style>
    body { background-color: #1a4d32; margin: 0; padding: 20px 10px; font-family: 'Malgun Gothic', sans-serif; color: #ffffff; }
    .main-wrapper { width: 100%; max-width: 500px; margin: 0 auto; }
    .header-section { text-align: center; margin-bottom: 20px; }
    .title-img { width: 100%; max-width: 500px; height: auto; margin-bottom: 10px; border-radius: 10px; }
    
    .kakao-btn { 
      display: flex; align-items: center; justify-content: center;
      background-color: #fee500; color: #3c1e1e; padding: 12px; 
      border-radius: 10px; text-decoration: none; font-weight: bold; 
      margin: 10px 0; font-size: 14px; gap: 8px;
    }
    .brand-logo-small { font-weight: 900; background: #3c1e1e; color: #fee500; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
    
    .intro-text { font-size: 14px; line-height: 1.6; margin-bottom: 20px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 10px; }
    .card-row { display: flex; gap: 10px; margin-bottom: 20px; }
    .card { background: #ffffff; border-radius: 15px; padding: 15px; flex: 1; color: #111111; text-align: center; }
    
    .beauty-card { background: #fdf6e3; border: 2px solid #c29d6d; border-radius: 15px; padding: 15px; margin-bottom: 20px; text-align: center; }
    
    .btn { display: block; padding: 8px 0; border-radius: 20px; text-decoration: none; font-size: 12px; font-weight: bold; margin: 5px 0; color: #fff; }
    .btn-blue { background-color: #2c3e50; }
    .btn-purple { background-color: #8e44ad; }
    .btn-gold { background-color: #c29d6d; }
    
    .family-section { margin-top: 30px; }
    .family-btn { display: block; background: rgba(255,255,255,0.1); color: #fff; padding: 12px; border-radius: 10px; text-decoration: none; margin-bottom: 8px; font-size: 13px; text-align: center; border: 1px solid rgba(255,255,255,0.2); }
  </style>
</head>
<body>
  <div class="main-wrapper">
    <div class="header-section">
      <img src="https://github.com/imdaeho242-bot/imdaeho242-bot.github.io/blob/main/%ED%83%80%EC%9D%B4%ED%8B%80.png?raw=true" alt="휴브릿지 비즈 24" class="title-img">
      <a href="https://pf.kakao.com/_xgEgnX" class="kakao-btn">
        <span class="brand-logo-small">HU</span> 카카오톡 상담 바로가기
      </a>
    </div>
    <section class="intro-text">
      휴브릿지는 미용재료를 비롯한 다양한 산업 분야의 제품 및 의료용 장비 공급, 생활가전 렌탈 서비스, 그리고 사업 운영에 필요한 자금 지원을 통해 미래를 함께 설계하는 전문 비즈니스 파트너입니다.
    </section>
    
    <div class="card-row">
      <div class="card">
        <h3>기업·가정 렌탈</h3>
        <a href="https://blog.naver.com/sora2220" class="btn btn-blue">장비렌탈</a>
        <a href="http://withmoa.co.kr" class="btn btn-blue">가전렌탈</a>
      </div>
      <div class="card">
        <h3>상품 판매·중개</h3>
        <a href="http://www.제로스톤.com" class="btn btn-purple">상품중개</a>
        <a href="https://i.imgur.com/j2xJywP.png" class="btn btn-purple">창업문의</a>
      </div>
    </div>
    
    <div class="beauty-card">
      <h3 style="color: #1a4d32; margin-top: 0;">미용재료</h3>
      <a href="https://blog.naver.com/dlaeogh3" class="btn btn-gold">미용재료 판매 상담</a>
    </div>
    
    <div class="family-section">
      <h3 style="font-size: 14px; border-left: 3px solid #c29d6d; padding-left: 10px; margin-bottom: 10px;">FAMILY SITE</h3>
      <a href="https://blog.naver.com/haeyoung924" class="family-btn">햇빛 노인 재가 센터 (등급신청, 요양보호사 파견)</a>
      <a href="https://blog.naver.com/tmdgusdk119" class="family-btn">(주)천리환경</a>
    </div>
  </div>
</body>
</html>
