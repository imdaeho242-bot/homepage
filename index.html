<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>비즈니스 종합 플랫폼</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Noto Sans KR', Arial, sans-serif;
      background: linear-gradient(180deg, #0c3424, #061b13);
      color: #111;
    }

    .page {
      min-height: 100vh;
      padding: 60px 20px 30px;
      position: relative;
      overflow: hidden;
    }

    .title {
      text-align: center;
      color: #d9a35f;
      margin-bottom: 20px;
    }

    .title h1 {
      font-size: 28px;
      margin: 0 0 8px;
      font-weight: 800;
    }

    .title p {
      margin: 0;
      color: #ffffff;
      font-size: 14px;
      letter-spacing: 1px;
    }

    .triangle-area {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 560px;
      margin: 0 auto;
    }

    .triangle-card {
      position: absolute;
      width: 360px;
      height: 430px;
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding-top: 120px;
      filter: drop-shadow(0 8px 15px rgba(0,0,0,0.35));
    }

    .triangle-inner {
      width: 78%;
      transform: translateY(60px);
    }

    .triangle-inner h2 {
      font-size: 26px;
      margin: 0 0 12px;
      font-weight: 900;
      color: #000;
    }

    .triangle-inner p {
      font-size: 17px;
      margin: 0 0 20px;
      line-height: 1.45;
      color: #111;
    }

    .triangle-inner a {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 30px;
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      text-decoration: none;
      background: #333;
      white-space: nowrap;
    }

    /* 1번: 미용재료 - 제일 앞 */
    .beauty {
      left: 40px;
      top: 70px;
      background: linear-gradient(180deg, #fffdf4, #e9dba9);
      z-index: 3;
    }

    .beauty .triangle-inner a {
      background: #b28b00;
    }

    /* 2번: 기업·가정 렌탈 - 중간 */
    .rental {
      right: 80px;
      top: 10px;
      background: linear-gradient(180deg, #ffffff, #e7e7e7);
      z-index: 2;
    }

    .rental .triangle-inner a {
      background: #555;
    }

    /* 3번: 상품 중개 - 뒤쪽 */
    .broker {
      left: 230px;
      top: 140px;
      background: linear-gradient(180deg, #f7f7f7, #dcdcdc);
      z-index: 1;
    }

    .broker .triangle-inner a {
      background: #333;
    }

    .consult-button {
      position: fixed;
      right: 28px;
      bottom: 85px;
      background: #3b7a5a;
      color: #fff;
      padding: 16px 28px;
      border-radius: 40px;
      text-decoration: none;
      font-size: 20px;
      font-weight: 900;
      box-shadow: 0 8px 15px rgba(0,0,0,0.25);
      z-index: 20;
    }

    .footer-links {
      max-width: 900px;
      margin: 10px auto 0;
      text-align: center;
      font-size: 13px;
      color: #d8d8d8;
    }

    .footer-links a {
      color: #d8d8d8;
      text-decoration: none;
      margin: 0 8px;
      display: inline-block;
    }

    .footer-links a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .page {
        padding-top: 45px;
      }

      .title h1 {
        font-size: 23px;
      }

      .title p {
        font-size: 12px;
      }

        height: 620px;

      }

        font-size: 22px;
        margin-bottom: 8px;
      }

        font-size: 15px;
