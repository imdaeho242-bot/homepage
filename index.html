<!DOCTYPE html>
<html lang="ko">

  <style>

    .card-icon { width: 45px; height: 45px; object-fit: contain; }
    .btn-green-basic { display: block; background-color: #1a4d32; color: #ffffff; text-align: center; padding: 12px; border-radius: 30px; text-decoration: none; margin-top: 10px; font-weight: bold; }
    .btn-gold-large { display: block; background-color: #c29d6d; color: #ffffff; text-align: center; padding: 15px; border-radius: 30px; text-decoration: none; margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>
