<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>휴브릿지 비즈 24</title>
  <style>
    :root {
      --main-bg: #1a3a2d;
      --accent-gold: #c5a059;
      --card-bg: #ffffff;
      --text-main: #ffffff;
      --text-dark: #333333;
    }
    body { background-color: var(--main-bg); margin: 0; padding: 10px 10px; font-family: 'Pretendard', sans-serif; color: var(--text-main); }
    .main-wrapper { width: 100%; max-width: 500px; margin: 0 auto; }
    
    .brand-header { text-align: center; margin-bottom: 10px; }
    .title-img { width: 100%; height: auto; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    
    .phone-link { 
      display: block; width: 100%; background-color: var(--accent-gold); color: #ffffff; 
      padding: 15px 0; margin: 10px 0; border-radius: 8px; font-weight: bold; font-size: 16px; 
      text-align: center; text-decoration: none; cursor: pointer;
    }
    .kakao-btn { display: flex; align-items: center; justify-content: center; background-color: #fee500; color: #3c1e1e; padding: 12px; border-radius: 12px; text-decoration: none; font-weight: 800; margin-bottom: 15px; font-size: 15px; gap: 10px; }
    
    .intro-text { font-size: 14px; line-height: 1.6; margin-bottom: 15px; padding: 15px; background: rgba(255,255,255,0.08); border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
    .card-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .card { background: var(--card-bg); border-radius: 16px; padding: 15px 10px; color: var(--text-dark); text-align: center; }
    .card h3 { margin: 0 0 10px 0; font-size: 15px; }
    
    .beauty-card { background: linear-gradient(135deg, #fdf6e3 0%, #e8d0a9 100%); border: 2px solid var(--accent-gold); border-radius: 16px; padding: 15px; margin-bottom: 15px; text-align: center; }
    .beauty-card h3 { color: #1a4d32; margin-bottom: 10px; }
    
    .btn { display: block; padding: 8px 0; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 600; margin: 5px 0; color: #fff; transition: opacity 0.2s; }
    .btn-blue { background-color: #2c3e50; }
    .btn-purple { background-color: #7b4397; }
    .btn-gold { background-color: var(--accent-gold); color: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    
    .family-section { margin-top: 5px; }
    .family-title { font-size: 12px; color: var(--accent-gold); margin-bottom: 8px; font-weight: bold; }
    .family-btn { display: block; background: rgba(0,0,0,0.2); color: #fff; padding: 10px; border-radius: 10px; text-decoration: none; margin-bottom: 6px; font-size: 13px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }

    /* 반응형 설정 */
    .button-group { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
    @media (min-width: 769px) {
        .button-group { flex-direction: row; justify-content: center; gap: 20px; }
    }
  </style>
</head>
<body>
  <div class="main-wrapper">
    <div class="brand-header">
      <img src="https://github.com/imdaeho242-bot/imdaeho242-bot.github.io/blob/main/%ED%83%80%EC%9D%B4%ED%8B%80.png?raw=true" alt="휴브릿지 배너" class="title-img">
      <div class="button-group">
        <a href="tel:01064519115" class="phone-link">상담 문의: 010-6451-9115</a>
        <a href="https://pf.kakao.com/_xgEgnX" class="kakao-btn">HJ 카카오톡 상담 바로가기</a>
      </div>
    </div>
          
    <section class="intro-text">
      휴브릿지는 미용재료를 비롯한 다양한 산업 분야의 제품 및 의료용 장비 공급, 생활가전 렌탈 서비스, 그리고 사업 운영에 필요한 자금 지원을 통해 미래를 함께 설계하는 전문 비즈니스 파트너입니다.
    </section>
    
    <div class="card-row">
      <div class="card">
        <h3>기업·가전 렌탈</h3>
        <a href="https://blog.naver.com/sora2220" class="btn btn-blue">장비렌탈 blog</a>
        <a href="https://hubridge678.blogspot.com" class="btn btn-blue">의료장비 blog</a>
      </div>
      <div class="card">
        <h3>상품 판매·중개</h3>
        <a href="http://withmoa.co.kr" class="btn btn-purple">가전 렌탈 바로가기</a>
        <a href="http://www.제로스톤.com" class="btn btn-purple">상품중개 blog</a>
      </div>
    </div>
    
    <div class="beauty-card">
      <h3>미용재료</h3>
      <a href="https://blog.naver.com/dlaeogh3" class="btn btn-gold">미용재료 blog 바로가기</a>
    </div>
    
    <div class="family-section">
      <div class="family-title">FAMILY SITE</div>
      <a href="https://blog.naver.com/haeyoung924" class="family-btn">햇빛 노인 재가 센터 blog</a>
      <a href="https://blog.naver.com/tmdgusdk119" class="family-btn">(주)천리환경 blog</a>
    </div>
  </div>
</body>
</html>
