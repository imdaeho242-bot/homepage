<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>휴브릿지 비즈니스 플랫폼</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Pretendard',sans-serif;
}

body{
background:#07132d;
padding:30px 15px;
color:#fff;
}

.container{
max-width:900px;
margin:auto;
}

h1{
text-align:center;
font-size:42px;
font-weight:800;
margin-bottom:50px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-bottom:20px;
}

.card{
background:#ecd9d9;
border-radius:30px;
padding:30px 20px;
text-align:center;
color:#111827;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.card h2{
font-size:34px;
margin-bottom:20px;
}

.card p{
font-size:22px;
line-height:1.7;
margin-bottom:30px;
}

.btn{
display:inline-block;
background:#06153b;
color:white;
padding:18px 40px;
border-radius:50px;
font-size:24px;
font-weight:700;
text-decoration:none;
}

.wide{
background:#e2b68f;
padding:40px;
border-radius:30px;
text-align:center;
margin-top:10px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.wide h2{
font-size:42px;
color:#111827;
margin-bottom:20px;
}

.wide p{
font-size:26px;
line-height:1.7;
color:#333;
margin-bottom:30px;
}

.footer{
text-align:center;
margin-top:50px;
}

.footer h2{
font-size:54px;
font-weight:800;
}

@media(max-width:768px){

h1{
font-size:28px;
}

.grid{
grid-template-columns:1fr;
}

.card h2{
font-size:26px;
}

.card p{
font-size:18px;
}

.btn{
font-size:18px;
padding:15px 30px;
}

.wide h2{
font-size:30px;
}

.wide p{
font-size:18px;
}

.footer h2{
font-size:32px;
}

}

</style>

</head>

<body>

<div class="container">

<h1>휴브릿지 비즈니스 플랫폼</h1>

<div class="grid">

<div class="card">
<h2>기업가형 병원</h2>
<p>
병원 운영 자금<br>
렌탈 상담 안내
</p>

<a href="tel:01064519115" class="btn">
전화 상담 바로가기
</a>
</div>

<div class="card">
<h2>제조소형 창업</h2>
<p>
창업 자금<br>
상품 중개 상담
</p>

<a href="https://blog.naver.com/" class="btn">
비즈니스 상담
</a>
</div>

</div>

<div class="wide">

<h2>미용재료</h2>

<p>
미용재료 및<br>
클리닉 제품 상담
</p>

<a href="#" class="btn">
미용재료 바로가기
</a>

</div>

<div class="footer">
<h2>상담 문의 010-6451-9115</h2>
</div>

</div>

</body>
</html>
