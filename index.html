<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>홈페이지</title>
  
  <meta name="naver-site-verification" content="f75bbd2a0eb54b49a0eb1cfc9cbdb924" />

  <style>
    /* 1. 배경 화면 전체 설정 및 밝기 보정 */
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      
      /* 질문자님의 멋진 풍경 사진을 배경으로 지정 */
      background-image: url('https://raw.githubusercontent.com/imdaeho242-bot/imdaeho242-bot.github.io/main/1000023350.png'); 
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      
      /* 어두운 아래쪽 풍경을 화사하고 밝게 보정 (밝기 1.3배) */
      backdrop-filter: brightness(1.3) contrast(1.1);
      -webkit-backdrop-filter: brightness(1.3) contrast(1.1);
      
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Malgun Gothic', sans-serif;
    }

    /* 2. 모바일 화면에서 명함 상자가 좌우로 시원하게 꽉 차도록 조절 */
    .container { 
      width: 100% !important;
      max-width: 450px; /* 컴퓨터로 볼 때 너무 퍼지지 않게 잡아주는 크기 */
      min-height: 100vh;
      box-sizing: border-box;
      margin: 0 auto !important;
      border-radius: 0 !important; /* 화면에 꽉 찰 때는 모서리를 펴서 틈새를 없앱니다 */
      padding: 20px;
      
      /* 기존의 세련된 초록색 배경색과 부드러운 투명도 */
      background-color: rgba(0, 102, 51, 0.92) !important; 
      color: white;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 상자 안의 이미지(타이틀)가 작게 웅크리지 않고 가로로 꽉 차게 조절 */
    img {
      width: 100% !important;
      max-width: 100%;
      height: auto !important;
      margin-bottom: 20px;
    }

    /* 바로가기 버튼 스타일 정리 */
    .link-button {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      background-color: white;
      color: #006633;
      text-decoration: none;
      font-weight: bold;
      border-radius: 5px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div class="container">
  
    <img src="https://raw.githubusercontent.com/imdaeho242-bot/imdaeho242-bot.github.io/main/1000023350.png" alt="타이틀 이미지">

    <h2>안녕하세요, 반갑습니다!</h2>
    <p>저의 공식 홈페이지에 오신 것을 환영합니다.</p>
    <p>아래 링크를 통해 다양한 소식을 만나보세요.</p>
    
    <hr style="width: 100%; border: 0; height: 1px; background: rgba(255,255,255,0.3); margin: 20px 0;">

    <a href="https://blog.naver.com/" target="_blank" class="link-button">네이버 블로그 바로가기</a>
    <a href="https://www.youtube.com/" target="_blank" class="link-button">유튜브 채널 바로가기</a>
    <a href="#" class="link-button">카카오톡 비즈니스 문의</a>

  </div>

</body>
</html>
