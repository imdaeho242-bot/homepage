<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>휴브릿지 비즈 24</title>
  <style>
    body { background-color: #1a4d32; margin: 0; padding: 20px; font-family: 'Malgun Gothic', sans-serif; color: #fff; text-align: center; }
    .main { max-width: 500px; margin: 0 auto; }
    
    /* 카드 디자인: 중앙 정렬 */
    .card { background: #fff; color: #000; padding: 25px; border-radius: 25px; margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; }
    
    /* 이미지 디자인: 중앙 정렬 및 크기 고정 */
    .card img { width: 80px; height: 80px; object-fit: contain; margin-bottom: 15px; }
    
    /* 버튼 디자인 */
    .btn { display: block; width: 100%; max-width: 250px; background: #1a4d32; color: #fff; padding: 12px; border-radius: 30px; margin: 8px auto; text-decoration: none; font-weight: bold; }
    .btn-gold { background: #c29d6d; }
    
    h2, h3 { margin: 5px 0; }
  </style>
</head>
<body>
  <div class="main">
    <h1>휴브릿지 비즈 24</h1>
    <p>저희 공식 홈페이지에 오신 것을 환영합니다.</p>

    <!-- 1. 기업·가정 렌탈 -->
    <div class="card">
      <img src="1212.jpg" alt="렌탈">
      <h3>기업·가정 렌탈</h3>
      <p style="color:#777; font-size:14px; margin-bottom:15px;">장비.운영 및 생활 가전 지원</p>
      <a href="https://blog.naver.com/sora2220" class="btn">장비렌탈 비즈 가기</a>
      <a href="http://withmoa.co.kr" class="btn">가전 렌탈 비즈 가기</a>
    </div>

    <!-- 2. 판매·중개 -->
    <div class="card">
      <img src="재로스톤.jpg" alt="중개">
      <h3>판매·중개</h3>
      <p style="color:#777; font-size:14px; margin-bottom:15px;">음식물처리기 자료 보기</p>
      <a href="https://www.제로스톤.com" class="btn">상품중개 지즈 가기</a>
    </div>

    <!-- 3. 미용재료 -->
    <div class="card" style="border: 3px solid #c29d6d;">
      <img src="미용재료.jpg" alt="미용">
      <h2>미용재료</h2>
      <p style="color:#c29d6d; font-weight:bold; margin-bottom:15px;">미용재료 및 클리닉 제품 공급</p>
      <a href="https://blog.naver.com/dlaeogh3" class="btn btn-gold">미용재료 비즈 가기</a>
    </div>
  </div>
</body>
</html>
