<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>휴브릿지 비즈 24</title>
  <style>
    :root { 
      --bg-color: #f8f9fa;       /* 아주 밝은 회색 배경 */
      --accent-gold: #c5a059; 
      --text-main: #212529;      /* 가독성 좋은 짙은 회색 글자 */
      --card-shadow: 0 8px 24px rgba(0,0,0,0.08); 
    }
    
    body { 
        background-color: var(--bg-color) !important; 
        margin: 0; padding: 0; 
        font-family: 'Pretendard', sans-serif; 
        color: var(--text-main); 
        font-size: 1.25rem; /* 기본 글자 크기를 더 크게 설정 */
        line-height: 1.8; 
    }
    
    .main-wrapper { 
        width: 92%; 
        max-width: 1200px; /* PC에서 충분히 넓게 펼쳐짐 */
        margin: 0 auto; 
        padding: 60px 0; 
    }
    
    .brand-header { text-align: center; margin-bottom: 70px; }
    .title-img { width: 100%; max-width: 950px; height: auto; border-radius: 20px; box-shadow: var(--card-shadow); }
    
    .button-group { 
        display: flex; gap: 30px; /* 버튼 사이 여백 증가 */
        margin: 50px auto 0; max-width: 900px; 
    }
    @media (max-width: 768px) { .button-group { flex-direction: column; gap: 15px; } }
    
    .phone-link, .kakao-btn { 
        flex: 1; padding: 25px; border-radius: 16px; font-weight: 700; text-decoration: none; text-align: center; font-size: 1.2rem; 
    }
    .phone-link { background-color: var(--accent-gold); color: #fff; }
    .kakao-btn { background-color: #fee500; color: #333; }
    
    .intro-text { 
        font-size: 1.5rem; /* 소개 문구 크기 극대화 */
        font-weight: 500;
        line-height: 1.6; margin-bottom: 70px; 
        padding: 60px; background: #fff; 
        border-radius: 24px; text-align: center; color: #444;
        box-shadow: var(--card-shadow);
    }
    
    .card-row { 
        display: grid; grid-template-columns: 1fr 1fr; gap: 40px; 
        margin-bottom: 40px;
    }
    @media (max-width: 768px) { .card-row { grid-template-columns: 1fr; } }
    
    .card { background: #fff; border-radius: 24px; padding: 50px; text-align: center; box-shadow: var(--card-shadow); }
    .card h3 { font-size: 1.8rem; margin-top: 0; margin-bottom: 30px; color: #000; }
    
    .btn { display: block; padding: 20px; border-radius: 12px; text-decoration: none; font-size: 1.15rem; margin-top: 20px; color: #fff; font-weight: 600; }
    .btn-blue { background-color: #2c3e50; }
    .btn-purple { background-color: #8e44ad; }
    
    .beauty-card { 
        background: #fff; border: 2px solid #e8d0a9; padding: 50px; border-radius: 24px; 
        text-align: center; margin: 40px auto; box-shadow: var(--card-shadow);
    }
    .beauty-card h3 { font-size: 1.8rem; margin-top: 0; }
    .btn-gold { background-color: var(--accent-gold); color: #fff; display: block; padding: 20px; margin-top: 30px; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 1.2rem; }
    
    .family-section { margin-top: 80px; text-align: center; }
    .family-title { font-size: 1.1rem; color: #888; margin-bottom: 30px; font-weight: bold; letter-spacing: 6px; }
    .family-btn { display: inline-block; background: #eee; color: #555; padding: 20px 40px; border-radius: 12px; text-decoration: none; margin: 10px; font-size: 1.1rem; font-weight: 500; }
  </style>
</head>
<body>
  <div class="main-wrapper">
    <div class="brand-header">
      <img src="https://github.com/imdaeho242-bot/imdaeho242-bot.github.io/blob/main/%ED%83%80%EC%9D%B4%ED%8B%80.png?raw=true" alt="휴브릿지 배너" class="title-img">
      <div class="button-group">
        <a href="tel:01064519115" class="phone-link">상담 문의: 010-6451-9115</a>
        <a href="https://pf.kakao.com/_xgEgnX" class="kakao-btn">HU 카카오톡 상담 바로가기</a>
      </div>
    </div>
    
    <section class="intro-text">
      "휴브릿지는 미용·의료·가전 렌탈 및 금융 솔루션으로<br>고객의 성공적인 내일을 함께 설계하는 든든한 파트너입니다."
    </section>
    
    <div class="card-row">
      <div class="card">
        <h3>기업·가전 렌탈</h3>
        <a href="https://blog.naver.com/sora2220" class="btn btn-blue">장비렌탈 blog 바로가기</a>
        <a href="https://hubridge678.blogspot.com" class="btn btn-blue">의료관련 blog 바로가기</a>
      </div>
      <div class="card">
        <h3>가전 렌탈·중개</h3>
        <a href="http://withmoa.co.kr" class="btn btn-purple">가전 렌탈 바로가기</a>
        <a href="http://www.제로스톤.com" class="btn btn-purple">상품중개 </a>
      </div>
    </div>
    
    <div class="beauty-card">
      <h3>미용재료</h3>
      <a href="https://blog.naver.com/dlaeogh3" class="btn btn-gold">미용재료 blog 바로가기</a>
    </div>
    
    <div class="family-section">
      <div class="family-title">FAMILY SITE</div>
      <a href="https://blog.naver.com/haeyoung924" class="family-btn">햇빛 노인 재가 센터 </a>
      <a href="https://blog.naver.com/tmdgusdk119" class="family-btn">(주)천리환경 </a>
    </div>
  </div>
</body>
</html>
