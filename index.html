<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>휴브릿지 비즈 24</title>
  <style>
    body { background-color: #1a4d32; margin: 0; padding: 20px 10px; font-family: 'Malgun Gothic', sans-serif; color: #ffffff; }
    .main-wrapper { width: 100%; max-width: 500px; margin: 0 auto; }
    
    .header-section { text-align: center; margin-bottom: 25px; }
    .title-img { width: 100%; max-width: 500px; height: auto; margin-bottom: 15px; border-radius: 10px; }
    
    .top-menu { font-size: 12px; color: #b3d1be; margin-bottom: 10px; }
    .welcome-text { font-size: 15px; font-weight: bold; margin-bottom: 20px; }
    
    .card-row-2col { display: flex; gap: 10px; margin-bottom: 10px; }
    
    .white-card { background-color: #ffffff; border-radius: 20px; padding: 15px 10px; flex: 1; color: #111111; text-align: center; }
    .card-icon { width: 45px; height: 45px; margin-bottom: 8px; }
    
    .btn-rental { background-color: #2c3e50; color: #ffffff; }
    .btn-sell { background-color: #8e44ad; color: #ffffff; }
    .btn-beauty { background-color: #c29d6d; color: #ffffff; }
    
    .btn-common { display: block; width: 90%; margin: 5px auto; padding: 8px 0; border-radius: 20px; text-decoration: none; font-size: 12px; font-weight: bold; }
    
    /* 미용재료 카드 디자인 */
    .large-beauty-card { background-color: #ffffff; border-radius: 20px; padding: 20px; margin-bottom: 25px; border: 3px solid #c29d6d; color: #111111; text-align: center; }
    .beauty-img { width: 100%; max-width: 200px; height: auto; border-radius: 10px; margin-bottom: 10px; }
    
    .family-section { width: 100%; }
    .title-text { font-size: 13px; font-weight: bold; color: #a4c4b5; margin-bottom: 10px; border-left: 3px solid #c29d6d; padding-left: 8px; }
    .btn-family-style { display: block; text-align: center; background: rgba(255, 255, 255, 0.1); color: #ffffff; padding: 12px; border-radius: 25px; text-decoration: none; margin-bottom: 8px; border: 1px solid rgba(255, 255, 255, 0.3); font-size: 13px; }
  </style>
</head>
<body>
  <div class="main-wrapper">
    <div class="header-section">
      <img src="https://github.com/imdaeho242-bot/imdaeho242-bot.github.io/blob/main/%ED%83%80%EC%9D%B4%ED%8B%80.png?raw=true" alt="휴브릿지 비즈 24" class="title-img">
      <div class="top-menu">미용재료 · 기업/가정 렌탈 · 상품중개</div>
      <p class="welcome-text">저희 홈페이지를 찾아 주신 것을 환영합니다.</p>
    </div>
    
    <div class="card-row-2col">
      <div class="white-card">
        <img src="https://i.imgur.com/yWLrabS.jpeg" class="card-icon">
        <h3>기업·가정 렌탈</h3>
        <a href="https://blog.naver.com/sora2220" class="btn-common btn-rental">장비렌탈</a>
        <a href="http://withmoa.co.kr" class="btn-common btn-rental">가전렌탈</a>
      </div>
      <div class="white-card">
        <img src="https://i.imgur.com/BKLrjUL.jpeg" class="card-icon">
        <h3>판매·중개</h3>
        <a href="http://www.제로스톤.com" class="btn-common btn-sell">상품중개</a>
        <a href="https://i.imgur.com/j2xJywP.png" class="btn-common btn-sell">창업문의</a>
      </div>
    </div>
    
    <div class="large-beauty-card">
      <img src="https://postfiles.pstatic.net/MjAyNjA2MDhfNjgg/MDAxNzgwOTE4MDE4ODQ5.D44w36jiN_ysbUvq0P17IB9eAQVtfwZBbgpuGG93xuUg.B60TVvswfKTgGmNBePIbYd26LRpeR7U5JgCYaRYbPfkg.JPEG/3.jpg?type=w966" alt="미용재료" class="beauty-img">
      <h2 style="margin: 5px 0;">미용재료</h2>
      <p style="color: #666; margin-bottom: 15px;">미용재료 및 클리닉 제품 공급</p>
      <a href="https://blog.naver.com/dlaeogh3" class="btn-common btn-beauty" style="width: 200px;">미용재료 바로가기</a>
    </div>
    
    <div class="family-section">
      <div class="title-text">패밀리 사이트</div>
      <a href="https://blog.naver.com/haeyoung924" class="btn-family-style">햇빛 노인 재가 센터</a>
      <a href="https://blog.naver.com/tmdgusdk119" class="btn-family-style">(주) 천리환경</a>
    </div>
  </div>
</body>
</html>
