<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>휴브릿지 비즈 24</title>
  <style>
    :root { --main-bg: #1a3a2d; --accent-gold: #c5a059; --card-bg: #ffffff; --text-main: #ffffff; --text-dark: #333333; }
    body { background-color: var(--main-bg); margin: 0; padding: 20px; font-family: 'Pretendard', sans-serif; color: var(--text-main); }
    
    /* PC/모바일 레이아웃 분리 */
    .main-wrapper { width: 100%; max-width: 500px; margin: 0 auto; }
    @media (min-width: 769px) { .main-wrapper { max-width: 800px; } }
    
    .brand-header { text-align: center; margin-bottom: 20px; }
    .title-img { width: 100%; height: auto; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    
    /* 버튼 그룹 */
    .button-group { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
    @media (min-width: 769px) { .button-group { flex-direction: row; justify-content: center; } }
    
    .phone-link, .kakao-btn { padding: 15px 30px; border-radius: 8px; font-weight: bold; text-decoration: none; text-align: center; display: block; }
    .phone-link { background-color: var(--accent-gold); color: #fff; }
    .kakao-btn { background-color: #fee500; color: #3c1e1e; }
    
    .intro-text { font-size: 14px; line-height: 1.6; margin-bottom: 20px; padding: 20px; background: rgba(255,255,255,0.08); border-radius: 12px; }
    .card-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    .card { background: var(--card-bg); border-radius: 16px; padding: 20px; color: var(--text-dark); text-align: center; }
    .btn { display: block; padding: 10px; border-radius: 8px; text-decoration: none; font-size: 14px; margin-top: 10px; color: #fff; transition: opacity 0.2s; }
    .btn-blue { background-color: #2c3e50; }
    .btn-purple { background-color: #7b4397; }
    .beauty-card { background: #e8d0a9; padding: 20px; border-radius: 16px; text-align: center; color: #1a4d32; margin-bottom: 20px; }
    .btn-gold { background-color: var(--accent-gold); color: #fff; display: block; padding: 10px; margin-top: 10px; border-radius: 8px; text-decoration: none; }
    
    /* 패밀리 사이트 섹션 */
    .family-section { margin-top: 20px; }
    .family-title { font-size: 14px; color: var(--accent-gold); margin-bottom: 10px; font-weight: bold; text-align: center; }
    .family-btn { display: block; background: rgba(255,255,255,0.1); color: #fff; padding: 12px; border-radius: 10px; text-decoration: none; margin-bottom: 8px; font-size: 14px; text-align: center; }
  </style>
</head>
<body>
  <div class="main-wrapper">
    <div class="brand-header">
      <img src="https://github.com/imdaeho242-bot/imdaeho242-bot.github.io/blob/main/%ED%83%80%EC%9D%B4%ED%8B%80.png?raw=true" alt="휴브릿지 배너" class="title-img">
      <div class="button-group">
        <a href="tel:01064519115" class="phone-link">상담 문의: 010-6451-9115</a>
        <a href="https://pf.kakao.com/_xgEgnX" class="kakao-btn">HJ 카카오톡 상담 바로가기</a>
      </div>
    </div>
    <section class="intro-text">
      휴브릿지는 미용재료, 의료장비, 가전 렌탈 및 자금 지원을 통해 미래를 설계하는 전문 파트너입니다.
    </section>
    <div class="card-row">
      <div class="card"><h3>기업·가전 렌탈</h3><a href="https://blog.naver.com/sora2220" class="btn btn-blue">장비렌탈 blog</a><a href="https://hubridge678.blogspot.com" class="btn btn-blue">의료장비 blog</a></div>
      <div class="card"><h3>상품 판매·중개</h3><a href="http://withmoa.co.kr" class="btn btn-purple">가전 렌탈 바로가기</a><a href="http://www.제로스톤.com" class="btn btn-purple">상품중개 blog</a></div>
    </div>
    <div class="beauty-card"><h3>미용재료</h3><a href="https://blog.naver.com/dlaeogh3" class="btn btn-gold">미용재료 blog</a></div>
    
    <div class="family-section">
      <div class="family-title">FAMILY SITE</div>
      <a href="https://blog.naver.com/haeyoung924" class="family-btn">햇빛 노인 재가 센터 blog</a>
      <a href="https://blog.naver.com/tmdgusdk119" class="family-btn">(주)천리환경 blog</a>
    </div>
  </div>
</body>
</html>
