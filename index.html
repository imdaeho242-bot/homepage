<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>비즈니스 플랫폼</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 0; background-color: #f4f6f9; }
        header { background: #1e2d42; color: white; padding: 40px; text-align: center; }
        .container { display: flex; justify-content: center; gap: 20px; padding: 40px; flex-wrap: wrap; }
        .card { background: white; padding: 20px; border-radius: 10px; width: 300px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .card h3 { color: #1e2d42; }
        .card a { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #dfb76c; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>

    <header>
        <h1>비즈니스 종합 플랫폼</h1>
    </header>

    <div class="container">
        <div class="card">
            <h3>미용재료 유통</h3>
            <p>미용재료 유통, 기업/가정 렌탈 등</p>
            <a href="#">미용재료 유통 바로가기</a>
        </div>
        <div class="card">
            <h3>종합 렌탈 서비스</h3>
            <p>기업 및 가정용 렌탈 솔루션</p>
            <a href="#">종합 렌탈 바로가기</a>
        </div>
        <div class="card">
            <h3>상품 중개 & 판매</h3>
            <p>우수한 리빙/산업 상품 중개</p>
            <a href="#">상품 중개 바로가기</a>
        </div>
    </div>

</body>
</html>
