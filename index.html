<!DOCTYPE html>

<head>

  <style>
    body { background-color: #1a4d32; margin: 0; padding: 40px 15px; font-family: 'Malgun Gothic', sans-serif; color: #ffffff; }
    .main-wrapper { max-width: 600px; margin: 0 auto; box-sizing: border-box; }
    .header-section { text-align: center; margin-bottom: 35px; }
    h1 { font-size: 32px; font-weight: bold; color: #fffbdf; margin: 0 0 10px 0; }
    .top-menu { font-size: 14px; color: #b3d1be; margin-bottom: 25px; }
    .card-row-2col { display: flex; gap: 15px; margin-bottom: 20px; }
    .white-card { background-color: #ffffff; border-radius: 25px; padding: 20px 15px; flex: 1; color: #111111; }
    .card-title-group { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
    .card-icon { width: 45px; height: 45px; object-fit: contain; }
    .btn-green-basic { display: block; background-color: #1a4d32; color: #ffffff; text-align: center; padding: 12px 10px; border-radius: 30px; margin-bottom: 8px; text-decoration: none; font-size: 13px; font-weight: bold; }
    .large-beauty-card { background-color: #ffffff; border-radius: 25px; padding: 30px 20px; margin-bottom: 35px; border: 3px solid #c29d6d; color: #111111; }
    .large-card-group { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 25px; }
    .large-icon { width: 80px; height: 80px; object-fit: contain; }
    .btn-gold-large { display: block; background-color: #c29d6d; color: #ffffff; text-align: center; padding: 15px; border-radius: 30px; text-decoration: none; font-size: 16px; font-weight: bold; }
    .family-section { width: 100%; text-align: left; }
    .title-text { font-size: 15px; font-weight: bold; color: #a4c4b5; margin: 0 0 12px 10px; border-left: 3px solid #c29d6d; padding-left: 8px; }
    .btn-family-style { display: block; text-align: center; background: rgba(255, 255, 255, 0.08); color: #ffffff; padding: 15px; border-radius: 30px; text-decoration: none; margin-bottom: 10px; border: 1px solid rgba(255, 255, 255, 0.2); }
  </style>
</head>

" alt="판매중개" class="card-icon">
