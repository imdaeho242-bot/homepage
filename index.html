<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>휴브릿지 비즈 24</title>
  
  <style>
    /* 전체 배경 및 폰트 설정 */
    body {
      background-color: #1a4d32;
      margin: 0;
      padding: 40px 15px;
      font-family: 'Malgun Gothic', sans-serif;
      color: #ffffff;
    }
    
    .main-wrapper {
      max-width: 600px;
      margin: 0 auto;
      box-sizing: border-box;
    }
    /* 상단 헤더 영역 */
    .header-section {
      text-align: center;
      margin-bottom: 35px;
    }
    .header-section h1 {
      font-size: 32px;
      font-weight: bold;
      color: #fffbdf;
      margin: 0 0 10px 0;
      letter-spacing: -1px;
    }
    .header-section .top-menu {
      font-size: 14px;
      color: #b3d1be;
      margin-bottom: 25px;
    }
    .header-section .welcome-text {
      font-size: 15px;
      line-height: 1.6;
      color: #ffffff;
      margin: 0;
    }
    /* 중간 2단 카드 레이아웃 */
    .card-row-2col {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
    }
    
    .white-card {
      background-color: #ffffff;
      border-radius: 25px;
      padding: 20px 15px;
      flex: 1;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }
    
    .card-icon {
      width: 45px;
      height: 45px;
      object-fit: cover; /* 이미지가 찌그러지지 않게 설정 */
    }
    .card-title-text {
      text-align: left;
    }
    .card-title-text h3 {
      font-size: 16px;
      color: #111111;
      margin: 0 0 4px 0;
      font-weight: bold;
      word-break: keep-all;
    }
    .card-title-text p {
      font-size: 12px;
      color: #777777;
      margin: 0;
      word-break: keep-all;
    }
    .btn-green-basic {
      display: block;
      background-color: #1a4d32;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 10px;
      border-radius: 30px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      box-sizing: border-box;
    }
    
    /* 하단 대형 카드 */
    .large-beauty-card {
      background-color: #ffffff;
      border-radius: 25px;
      padding: 30px 20px;
      box-sizing: border-box;
      margin-bottom: 35px;
      border: 3px solid #c29d6d;
    }
    .large-card-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 25px;
    }
    .large-icon {
      width: 80px;
      height: 80px;
      object-fit: cover; /* 이미지가 찌그러지지 않게 설정 */
    }
    .large-text-group {
      text-align: left;
    }
    .large-text-group h2 {
      font-size: 24px;
      color: #111111;
      margin: 0 0 6px 0;
      font-weight: bold;
    }
    .large-text-group p {
      font-size: 14px;
      color: #c29d6d;
      margin: 0;
      font-weight: bold;
    }
    .btn-gold-large {
      display: block;
      width: 100%;
      background-color: #c29d6d;
      color: #ffffff;
      text-decoration: none;
      padding: 15px 0;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
    }
    /* 패밀리 사이트 */
    .family-section {
      width: 100%;
      text-align: left;
    }
    .title-text {
      font-size: 15px;
      font-weight: bold;
      color: #a4c4b5;
      margin: 0 0 12px 10px;
      border-left: 3px solid #c29d6d;
      padding-left: 8px;
    }
    .btn-family-style {
      display: block;
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      text-decoration: none;
      padding: 15px 20px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <div class="main-wrapper">
    
    <div class="header-section">
      <h1>휴브릿지 비즈 24</h1>
      <div class="top-menu">미용재료 · 기업/가정 렌탈 · 상품중개</div>
      <p class="welcome-text">저희 공식 홈페이지에<br>오신 것을 환영합니다.</p>
    </div>
    
    <div class="card-row-2col">
      <div class="white-card">
        <div class="card-title-group">
          <img src="https://postfiles.pstatic.net/MjAyNjA2MDhfMzgg/MDAxNzgwOTE4MDE4ODQ4.7EemwJtuYGSd-vVFdmD3zVrFLrDcn8iQtugOzvlsNvog.IPN1u-pgL3toXkvtJqVs33yMUuYyrHUfHdXEkO6zBtMg.JPEG/1.jpg?type=w966" alt="장비렌탈" class="card-icon">
          <div class="card-title-text">
            <h3>기업·가정 렌탈</h3>
            <p>운영 및 생활 가전 지원</p>
          </div>
        </div>
        <div>
          <a href="https://blog.naver.com/sora2220" target="_blank" class="btn-green-basic">장비렌탈 바로가기</a>
          <a href="http://withmoa.co.kr" target="_blank" class="btn-green-basic">가전 렌탈 바로가기</a>
        </div>
      </div>
      
      <div class="white-card">
        <div class="card-title-group">
          <img src="https://postfiles.pstatic.net/MjAyNjA2MDhfMTg5/MDAxNzgwOTE4MDE4ODQ4.t4tm_OomtGTELzJDXFHi0JqbOS4azartnt2jqrgxs_4g.Ic8tjg00lK2HZTbcvsTR00aASaf5y3u0zd1iX3cOWA0g.JPEG/2.jpg?type=w966" alt="판매중개" class="card-icon">
          <div class="card-title-text">
            <h3>판매·중개</h3>
            <p>음식물처리 기기<br>자료 보기</p>
          </div>
        </div>
        <div>
          <a href="https://www.제로스톤.com" target="_blank" class="btn-green-basic">상품중개 바로가기</a>
        </div>
      </div>
    </div>
    
    <div class="large-beauty-card">
      <div class="large-card-group">
        <img src="https://postfiles.pstatic.net/MjAyNjA2MDhfNjgg/MDAxNzgwOTE4MDE4ODQ5.D44w36jiN_ysbUvq0P17IB9eAQVtfwZBbgpuGG93xuUg.B60TVvswfKTgGmNBePIbYd26LRpeR7U5JgCYaRYbPfkg.JPEG/3.jpg?type=w966" alt="미용재료" class="large-icon">
        <div class="large-text-group">
          <h2>미용재료</h2>
          <p>미용재료 및 클리닉 제품 공급</p>
        </div>
      </div>
      <a href="https://blog.naver.com/dlaeogh3" target="_blank" class="btn-gold-large">미용재료 바로가기</a>
    </div>
    
    <div class="family-section">
      <div class="title-text">패밀리 사이트</div>
      <a href="https://blog.naver.com/haeyoung924" target="_blank" class="btn-family-style">햇빛 노인 재가 센터 바로가기</a>
      <a href="https://blog.naver.com/tmdgusdk119" target="_blank" class="btn-family-style">(주) 천리환경 바로가기</a>
    </div>
  </div>
</body>
</html>
