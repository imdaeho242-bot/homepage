<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>휴브릿지 비즈 24</title>
  <style>
    :root { 
      --bg-deep: #0f172a; /* 전체 배경: 깊은 네이비 톤 */
      --card-bg: #ffffff; 
      --accent-gold: #c5a059; 
      --text-main: #f8fafc;
      --text-card: #1e293b;
    }
    
    body { 
        background-color: var(--bg-deep); 
        margin: 0; padding: 0; 
        font-family: 'Pretendard', sans-serif; 
        color: var(--text-main); 
        font-size: 1.25rem; 
    }
    
    .main-wrapper { width: 92%; max-width: 1100px; margin: 0 auto; padding: 40px 0; }
    
    .brand-header { text-align: center; margin-bottom: 50px; }
    .title-img { width: 100%; max-width: 900px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    
    .button-group { display: flex; gap: 20px; margin: 40px auto; }
    @media (max-width: 768px) { .button-group { flex-direction: column; } }
    
    .phone-link, .kakao-btn { flex: 1; padding: 20px; border-radius: 12px; font-weight: 700; text-decoration: none; text-align: center; font-size: 1.2rem; }
    .phone-link { background-color: var(--accent-gold); color: #fff; }
    .kakao-btn { background-color: #fee500; color: #333; }
    
    /* 소개 문구 부분: 배경 컬러를 입혀 강조 */
    .intro-text { 
        font-size: 1.5rem; line-height: 1.6; margin-bottom: 50px; 
        padding: 40px; background: linear-gradient(135deg, #1e293b, #334155);
        border: 2px solid var(--accent-gold);
        border-radius: 24px; text-align: center;
    }
    
    .card-row { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 25px; }
    @media (max-width: 768px) { .card-row { grid-template-columns: 1fr; } }
    
    .card { background: #f1f5f9; border-radius: 20px; padding: 40px; text-align: center; color: var(--text-card); }
    
    .beauty-card { background: #fef3c7; padding: 40px; border-radius: 20px; text-align: center; color: #78350f; margin-bottom: 25px; }
    
    .btn { display: block; padding: 18px; border-radius: 10px; text-decoration: none; font-size: 1.15rem; margin-top: 15px; color: #fff; font-weight: 600; }
    .btn-blue { background-color: #334155; }
    .btn-purple { background-color: #7e22ce; }
    .btn-gold { background-color: var(--accent-gold); color: #fff; }
    
    /* 패밀리 사이트 스타일 수정 */
    .family-section { background: #1e293b; padding: 40px; border-radius: 20px; text-align: center; }
    .family-title { font-size: 1rem; color: var(--accent-gold); margin-bottom: 20px; letter-spacing: 4px; }
    .family-btn { display: inline-block; background: #334155; color: #fff; padding: 15px 25px; border-radius: 10px; text-decoration: none; margin: 8px; }
  </style>
</head>
<body>
  <div class="main-wrapper">
    <div class="brand-header">
      <img src="https://github.com/imdaeho242-bot/imdaeho242-bot.github.io/blob/main/%ED%83%80%EC%9D%B4%ED%8B%80.png?raw=true" alt="휴브릿지 배너" class="title-img">
      <div class="button-group">
        <a href="tel:01064519115" class="phone-link">상담 문의: 010-6451-9115</a>
        <a href="https://pf.kakao.com/_xgEgnX" class="kakao-btn">HU 카카오톡 상담 바로가기</a>
      </div>
    </div>
    
    <section class="intro-text">
      "휴브릿지는 미용·의료·가전 렌탈 및 금융 솔루션으로<br>고객의 성공적인 내일을 함께 만들어 가겠습니다."
    </section>
    
    <div class="card-row">
      <div class="card"><h3>기업·의료 렌탈</h3><a href="https://blog.naver.com/sora2220" class="btn btn-blue">장비렌탈 blog</a><a href="https://hubridge678.blogspot.com" class="btn btn-blue">의료관련 blog</a></div>
      <div class="card"><h3>가전 렌탈·중개</h3><a href="http://withmoa.co.kr" class="btn btn-purple">가전 렌탈 바로가기</a><a href="http://www.제로스톤.com" class="btn btn-purple">상품중개 </a></div>
    </div>
    
    <div class="beauty-card"><h3>미용재료</h3><a href="https://blog.naver.com/dlaeogh3" class="btn btn-gold">미용재료 blog 바로가기</a></div>
    
    <div class="family-section">
      <div class="family-title">FAMILY SITE</div>
      <a href="https://blog.naver.com/haeyoung924" class="family-btn">햇빛 노인 재가 센터 </a>
      <a href="https://blog.naver.com/tmdgusdk119" class="family-btn">(주)천리환경 </a>
    </div>
  </div>
</body>
</html>
